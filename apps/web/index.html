<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080B" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <!-- Store ikoner direkte i HTML: Chrome på Android faller tilbake hit for «Opprett snarvei»
         over HTTP (ikke sikker kontekst), der manifest-ikonene ikke brukes. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <!--
      Manifestet (display: minimal-ui – iOS kutter bakgrunnslyd i standalone-PWA-er) legges bare inn
      utenfor /drop/: lyttersiden skal være en vanlig nettside, ikke installerbar (låst beslutning).
      Ingen apple-mobile-web-app-capable, av samme grunn.
    -->
    <script>
      if (!location.pathname.startsWith('/drop/')) {
        var l = document.createElement('link');
        l.rel = 'manifest';
        l.href = '/manifest.webmanifest';
        document.head.appendChild(l);
      }
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <title>Groovehouse Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-obsidian">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
